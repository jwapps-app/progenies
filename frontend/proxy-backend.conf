# Upstream settings shared by every API location in nginx.conf (included per
# location — proxy_set_header, like add_header, is not inherited into a
# location that sets any of its own). Copied to
# /etc/nginx/snippets/proxy-backend.conf.
#
# $upstream is a variable (set in the server block) so nginx re-resolves the
# backend's address via Docker DNS instead of caching it at startup.
proxy_pass $upstream;
proxy_http_version 1.1;
proxy_set_header Host $host;
# OVERWRITE, never append: by the time a request is here, $remote_addr is the
# real client (recovered from CF-Connecting-IP by the realip rules in
# nginx.conf). Appending to an inbound X-Forwarded-For would let a client seed
# the chain with any address it likes; the backend trusts exactly one hop —
# this one — and takes the leftmost entry as the client.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_read_timeout 120s;
