# Production web server: serves the built SPA and proxies the API on the same
# origin, so a single domain (and a single tunnel/port) fronts the whole app.
#
# This file is installed as /etc/nginx/conf.d/default.conf, which the stock
# nginx.conf includes from INSIDE its http {} block — so the map / log_format /
# limit_req_zone directives at the top of this file land in http context
# (where they are required to live), and the server block below sits next to
# them. Two snippets are shared by the locations:
#   /etc/nginx/snippets/security-headers.conf  response headers (every location)
#   /etc/nginx/snippets/proxy-backend.conf     upstream settings (API locations)
# nginx does NOT inherit add_header / proxy_set_header into a location that
# declares its own, so every location re-includes the snippet it needs rather
# than relying on inheritance.

# Was this connection made by a trusted hop (cloudflared / the Docker bridge)?
# Keyed on $realip_remote_addr — the socket address BEFORE the realip rules in
# the server block swap in CF-Connecting-IP — and listing the same ranges as
# set_real_ip_from below; keep the two in step.
geo $realip_remote_addr $trusted_hop {
    default        0;
    172.16.0.0/12  1;
    10.0.0.0/8     1;
    192.168.0.0/16 1;
    127.0.0.1      1;
}

# Scheme as the browser saw it. Cloudflare terminates TLS at the edge and sets
# X-Forwarded-Proto: https before the tunnel hands us plain HTTP. Honoured only
# from a trusted hop: anything else (a LAN client hitting the port directly)
# gets nginx's own $scheme, whatever header it sends.
map "$trusted_hop:$http_x_forwarded_proto" $forwarded_proto {
    default   $scheme;
    "1:https" https;
}

# Access-log scrubbing. Share-link tokens can appear in the request path —
# /share/<token> (legacy links; the SPA redirects them to /share#<token>) and,
# defensively, /public/<token>/... — and a token in a log line is a token in
# every log shipper and backup. Replace the segment before it is written.
map $request_uri $log_uri {
    ~^/(?<p>public|share)/[^/?]+(?<rest>.*)$ "/$p/[redacted]$rest";
    default                                   $request_uri;
}
# Same for the Referer: a same-origin fetch from the /share/<token> page would
# otherwise carry the token here.
map $http_referer $log_referer {
    ~^(?<pre>https?://[^/]+/(?:public|share)/)[^/?]+(?<rest>.*)$ "${pre}[redacted]${rest}";
    default                                                     $http_referer;
}
log_format scrubbed '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $log_uri $server_protocol" '
                    '$status $body_bytes_sent "$log_referer" "$http_user_agent"';

# Per-client throttles, keyed on the real client address (see set_real_ip_from
# below — without it every user behind the tunnel shares cloudflared's one
# address and one bucket). login: 10/min with a burst of 5 blunts credential
# stuffing without locking out a fumbled password. public: the unauthenticated
# share surface, 2/s sustained with a burst of 20 for the page's initial fan
# of requests.
limit_req_zone $binary_remote_addr zone=login:1m  rate=10r/m;
limit_req_zone $binary_remote_addr zone=public:10m rate=2r/s;
limit_req_status 429;

server {
    # 8080, not 80: the nginx-unprivileged base image runs as a non-root user
    # and cannot bind privileged ports. The host port mapping is unchanged.
    listen 8080;
    server_name _;
    server_tokens off;

    # Recover the true client address. Behind Cloudflare Tunnel, $remote_addr
    # is cloudflared's hop; CF-Connecting-IP carries the real client and cannot
    # be forged through the tunnel. Trust it only from private ranges — the
    # Docker bridge, the LAN, loopback — a request from anywhere else keeps its
    # socket address, header or not.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    # The LAN too: cloudflared commonly runs on a different machine than the
    # app (e.g. the tunnel on a NAS, the app on a Docker host), so its hop
    # arrives from a 192.168.x address. Without this line every visitor would
    # be logged and throttled as that one machine. The cost — a LAN device can
    # forge CF-Connecting-IP to dodge the per-IP limits — is small on a home
    # network and removable with a host firewall rule (see README).
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    access_log /dev/stdout scrubbed;

    # Resolve the backend through Docker's embedded DNS on every use instead of
    # once at startup: a recreated backend container gets a new address, and a
    # proxy_pass with a fixed hostname would keep sending traffic to the old
    # one until nginx itself restarted. proxy_pass with a variable re-resolves
    # (valid=10s caps the lookup rate). With no URI part on the variable, the
    # request URI is passed upstream unchanged.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream http://backend:8000;

    root /usr/share/nginx/html;
    index index.html;

    # GEDCOM uploads / photo data-URLs can be sizeable.
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    # Compress proxied responses too (the API's JSON). Requests that arrive via
    # Cloudflare carry a Via header, which the default `gzip_proxied off` treats
    # as "already behind a cache — don't compress".
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/manifest+json image/svg+xml application/x-gedcom;
    gzip_min_length 1024;

    # Login: throttled per client. Exact-match location, so it takes precedence
    # over the API regex below.
    location = /auth/login {
        limit_req zone=login burst=5 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    # Unauthenticated share-link data: throttled per client. `^~` is a prefix
    # match that stops the regex search, so this wins over the regex below.
    location ^~ /public/ {
        limit_req zone=public burst=20 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    # Backend API — same-origin proxy (the SPA calls relative /api and /auth;
    # /public serves the unauthenticated share-link data). /docs and /openapi
    # are intentionally NOT proxied — they're disabled in the backend for prod.
    location ~ ^/(api|auth|public|health) {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    # Hashed build assets are immutable — cache aggressively.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Service worker must always revalidate.
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Hash-named workbox runtime (emitted next to sw.js by vite-plugin-pwa).
    # Immutable like /assets — without this it falls into the SPA no-cache
    # fallback and is re-fetched on every load.
    location ~ ^/workbox-.+\.js$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Web app manifest. The alpine nginx mime table has no .webmanifest entry,
    # so without an explicit type it ships as application/octet-stream (and the
    # application/manifest+json gzip_type never matches). default_type only
    # kicks in for unmapped extensions, which .webmanifest is — a server-level
    # `types {}` block is NOT usable here, it would REPLACE the whole inherited
    # mime table rather than extend it.
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # SPA fallback: any other route is client-side. (/theme.js — the pre-paint
    # theme guard — and registerSW.js are plain files under the web root and
    # are served from here with no-cache, like index.html.)
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
