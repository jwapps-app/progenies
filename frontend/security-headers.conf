# Shared security response headers (included by every location in nginx.conf).
# `always` so they're sent on error responses too.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# HTTPS is terminated at the Cloudflare edge; tell browsers to stay on it.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# The app is fully same-origin. Scripts are locked to 'self' — the pre-paint
# theme guard ships as /theme.js (not inline) precisely so no 'unsafe-inline'
# is needed for script-src, which is what makes an injected <script> inert.
# Inline STYLE stays allowed: Tailwind/React and D3 set style attributes.
# Images and fonts allow data: URLs (profile photos are stored as data URIs).
# form-action 'self': the SPA never posts a form anywhere else; this stops an
# injected <form> from exfiltrating field contents to a third-party origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Browser features the app never uses — deny them outright so a script
# injection can't quietly turn them on.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# Isolate the browsing context: no cross-origin window can keep a handle on
# ours (COOP), and no cross-origin document can embed our responses (CORP).
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
